version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cyberlens_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberlens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cyberlens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cyberlens_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberlens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cyberlens_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cyberlens_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for logs
  mongodb:
    image: mongo:6-jammy
    container_name: cyberlens_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cyberlens}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_secret}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cyberlens_network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberlens_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyberlens}:${POSTGRES_PASSWORD:-cyberlens_secret}@postgres:5432/${POSTGRES_DB:-cyberlens}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      MONGO_URL: mongodb://${MONGO_USER:-cyberlens}:${MONGO_PASSWORD:-mongo_secret}@mongodb:27017
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      AI_SERVICE_URL: http://ai-service:8000
      HONEYPOT_URL: http://honeypot:4000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberlens_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # AI Scoring Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cyberlens_ai
    ports:
      - "8000:8000"
    networks:
      - cyberlens_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberlens_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cyberlens_network
    restart: unless-stopped

  # Honeypot Decoy Server
  honeypot:
    build:
      context: ./honeypot
      dockerfile: Dockerfile
    container_name: cyberlens_honeypot
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-cyberlens}:${MONGO_PASSWORD:-mongo_secret}@mongodb:27017
      BACKEND_URL: http://backend:3001
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    networks:
      - cyberlens_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cyberlens_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cyberlens_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  cyberlens_network:
    driver: bridge
